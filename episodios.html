<script>
  // Fuerza a los reproductores de Spotify y YouTube a recargarse de cero
  // cada vez que la página se muestra (carga normal, o cuando el
  // navegador la restaura desde su caché al volver con los links de
  // arriba) — así siempre traen el contenido más nuevo, no una "foto"
  // vieja guardada en memoria.
  function refreshEmbeds() {
    const spotify = document.getElementById('spotify-embed');
    if (spotify) spotify.src = spotify.src;
    const youtube = document.getElementById('youtube-embed');
    if (youtube) youtube.src = youtube.src;
  }
  window.addEventListener('pageshow', refreshEmbeds);
</script>
