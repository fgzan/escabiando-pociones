<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get('slug');

  function loadNoticia() {
    fetch('content/noticias.json?v=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        const items = Array.isArray(data) ? data : (data.noticias || []);
        const item = items.find(n => n.slug === slug && !n.draft);
        if (!item) {
          document.getElementById('news-header').innerHTML = '<h1>No encontramos esta noticia</h1>';
          document.getElementById('news-body').innerHTML = '';
          return;
        }
        document.title = item.title + ' — Escabiando Pociones';

        const cover = item.cover ? `<img src="${escapeHtml(fixAssetPath(item.cover))}" alt="" style="width:100%; border-radius:6px; margin-bottom:20px;">` : '';
        document.getElementById('news-header').innerHTML = `
          ${cover}
          <h1>${escapeHtml(item.title || '')}</h1>
          <p style="font-family: var(--f-mono); font-size:0.85rem; color: var(--ink-dim);">
            ${item.author ? escapeHtml(item.author) + ' · ' : ''}${item.date ? formatDate(item.date) : ''}
          </p>
        `;

        let bodyHtml = (typeof marked !== 'undefined' && item.body)
          ? marked.parse(fixAssetPathsInMarkdown(item.body))
          : `<p>${escapeHtml(item.body || '')}</p>`;
        bodyHtml = embedYouTube(bodyHtml);
        bodyHtml = openLinksInNewTab(bodyHtml);
        document.getElementById('news-body').innerHTML = bodyHtml;
      })
      .catch(() => {
        document.getElementById('news-header').innerHTML = '<h1>No pudimos cargar esta noticia</h1>';
      });
  }

  window.addEventListener('pageshow', loadNoticia);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function fixAssetPath(p) {
    return p ? p.replace(/^\/(assets\/)/, '$1') : p;
  }
  function fixAssetPathsInMarkdown(md) {
    return (md || '').replace(/\]\(\/assets\//g, '](assets/');
  }
  function embedYouTube(html) {
    return html.replace(
      /<p>\s*<a[^>]*href="https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})[^"]*"[^>]*>[^<]*<\/a>\s*<\/p>/g,
      (m, id) => `<div class="embed-wrap" style="margin:20px 0;"><iframe width="100%" height="400" src="https://www.youtube.com/embed/${id}" title="Video de YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`
    );
  }
  function openLinksInNewTab(html) {
    return html.replace(/<a (?![^>]*target=)/g, '<a target="_blank" rel="noopener" ');
  }
  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('es-419', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return iso; }
  }
</script>
