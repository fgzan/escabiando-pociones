<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get('slug');

  function loadReview() {
    fetch('content/reviews.json?v=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        const reviews = Array.isArray(data) ? data : (data.reviews || []);
        const review = reviews.find(r => r.slug === slug && !r.draft);
        if (!review) {
          document.getElementById('review-header').innerHTML = '<h1>No encontramos esta review</h1>';
          document.getElementById('review-body').innerHTML = '';
          return;
        }
        document.title = review.title + ' | Escabiando Pociones';
        updateMetaTags(review.title, review.excerpt || review.game || '', review.cover);
        injectArticleSchema('Review', review);

        const pct = Math.max(0, Math.min(100, (Number(review.score) || 0) * 10));
        const cover = review.cover ? `<img src="${escapeHtml(fixAssetPath(review.cover))}" alt="" style="width:100%; border-radius:6px; margin-bottom:20px;">` : '';
        document.getElementById('review-header').innerHTML = `
          ${cover}
          <span class="eyebrow">${escapeHtml(review.game || '')}</span>
          <h1>${escapeHtml(review.title || '')}</h1>
          <div class="vial-score" style="margin-bottom:8px;">
            <div class="vial"><div class="vial-fill" style="height:${pct}%;"></div></div>
            ${review.score != null ? review.score + ' / 10' : ''}
          </div>
          <p style="font-family: var(--f-mono); font-size:0.85rem; color: var(--ink-dim);">
            ${review.author ? escapeHtml(review.author) + ' · ' : ''}${review.date ? formatDate(review.date) : ''}
          </p>
        `;

        let bodyHtml = (typeof marked !== 'undefined' && review.body)
          ? marked.parse(fixAssetPathsInMarkdown(review.body))
          : `<p>${escapeHtml(review.body || '')}</p>`;
        bodyHtml = embedYouTube(bodyHtml);
        bodyHtml = embedTweet(bodyHtml);
        bodyHtml = openLinksInNewTab(bodyHtml);
        document.getElementById('review-body').innerHTML = bodyHtml;
        loadTwitterWidgets();
      })
      .catch(() => {
        document.getElementById('review-header').innerHTML = '<h1>No pudimos cargar esta review</h1>';
      });
  }

  window.addEventListener('pageshow', loadReview);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function fixAssetPath(p) {
    return p ? p.replace(/^\/(assets\/)/, '$1') : p;
  }
  function fixAssetPathsInMarkdown(md) {
    return (md || '').replace(/\]\(\/assets\//g, '](assets/');
  }
  function embedYouTube(html) {
    return html.replace(
      /<p>\s*<a[^>]*href="https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})[^"]*"[^>]*>[^<]*<\/a>\s*<\/p>/g,
      (m, id) => `<div class="embed-wrap" style="margin:20px 0;"><iframe width="100%" height="400" src="https://www.youtube.com/embed/${id}" title="Video de YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`
    );
  }
  function embedTweet(html) {
    return html.replace(
      /<p>\s*<a[^>]*href="(https?:\/\/(?:www\.)?(?:twitter\.com|x\.com)\/[A-Za-z0-9_]+\/status\/\d+)[^"]*"[^>]*>[^<]*<\/a>\s*<\/p>/g,
      (m, url) => `<blockquote class="twitter-tweet"><a href="${url}"></a></blockquote>`
    );
  }
  function loadTwitterWidgets() {
    if (window.twttr && window.twttr.widgets) { window.twttr.widgets.load(); return; }
    if (document.getElementById('twitter-widgets-script')) return;
    const s = document.createElement('script');
    s.id = 'twitter-widgets-script';
    s.src = 'https://platform.twitter.com/widgets.js';
    s.async = true;
    document.body.appendChild(s);
  }
  function openLinksInNewTab(html) {
    return html.replace(/<a (?![^>]*target=)/g, '<a target="_blank" rel="noopener" ');
  }
  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('es-419', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return iso; }
  }

  // Actualiza las meta tags (descripción, Open Graph, Twitter Card) con
  // el contenido real de la nota, una vez que terminó de cargar. Ayuda
  // sobre todo a Google (que sí ejecuta este JS al indexar) — los
  // bots de vista previa de redes sociales muchas veces no ejecutan
  // JavaScript, así que para esos casos queda el valor genérico fijo
  // en el HTML como respaldo.
  function updateMetaTags(title, description, cover) {
    const fullTitle = title + ' | Escabiando Pociones';
    const desc = (description || '').slice(0, 160);
    const image = cover ? (new URL(fixAssetPath(cover), window.location.href)).href : null;

    setMeta('name', 'description', desc);
    setMeta('property', 'og:title', fullTitle);
    setMeta('property', 'og:description', desc);
    setMeta('property', 'og:url', window.location.href);
    setMeta('name', 'twitter:title', fullTitle);
    setMeta('name', 'twitter:description', desc);
    if (image) {
      setMeta('property', 'og:image', image);
      setMeta('name', 'twitter:image', image);
    }
    let canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.href = window.location.href;
  }

  function setMeta(attr, key, value) {
    if (!value) return;
    let el = document.querySelector(`meta[${attr}="${key}"]`);
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute(attr, key);
      document.head.appendChild(el);
    }
    el.setAttribute('content', value);
  }

  // Datos estructurados (Schema.org) para que Google entienda que esto
  // es un artículo de reseña, con fecha, autor e imagen — es lo que
  // más mira Google News para decidir si mostrar la nota.
  function injectArticleSchema(kind, item) {
    const schema = {
      "@context": "https://schema.org",
      "@type": "ReviewNewsArticle",
      "headline": item.title,
      "description": item.excerpt || '',
      "datePublished": item.date || '',
      "dateModified": item.date || '',
      "author": { "@type": "Person", "name": item.author || "Escabiando Pociones" },
      "publisher": {
        "@type": "Organization",
        "name": "Escabiando Pociones",
        "logo": { "@type": "ImageObject", "url": new URL('assets/logo-full.png', window.location.href).href }
      },
      "mainEntityOfPage": { "@type": "WebPage", "@id": window.location.href }
    };
    if (item.cover) schema.image = [new URL(fixAssetPath(item.cover), window.location.href).href];
    if (item.score != null) {
      schema.reviewRating = { "@type": "Rating", "ratingValue": item.score, "bestRating": 10, "worstRating": 0 };
      schema.itemReviewed = { "@type": "VideoGame", "name": item.game || item.title };
    }

    let script = document.getElementById('article-schema');
    if (!script) {
      script = document.createElement('script');
      script.type = 'application/ld+json';
      script.id = 'article-schema';
      document.head.appendChild(script);
    }
    script.textContent = JSON.stringify(schema);
  }
</script>
