<link rel="stylesheet" href="style.css">

</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <img src="assets/logo-full.png" alt="Escabiando Pociones">
      ESCABIANDO POCIONES
    </a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>

      <li><a href="prensa.html">Prensa</a></li>
    </ul>

</nav>

<header class="page-header">
  <div class="container">
    <a href="reviews.html" class="eyebrow" style="display:inline-block; margin-bottom:18px;">← Volver a Reviews</a>
    <div id="review-header">
      <h1>Cargando…</h1>
    </div>
  </div>
</header>

<section class="section">
  <div class="container" style="max-width: 760px;">
    <div id="review-body"></div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <small>© 2026 Escabiando Pociones</small>
    <div class="social-links">
      <a href="https://open.spotify.com/show/587CqZd5K8oaRWqiVCQWSP" target="_blank" rel="noopener">Spotify</a>
      <a href="https://www.youtube.com/@EscabiandoPociones/videos" target="_blank" rel="noopener">YouTube</a>
      <a href="prensa.html">Prensa</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get('slug');

  function loadReview() {
    fetch('content/reviews.json?v=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        const reviews = Array.isArray(data) ? data : (data.reviews || []);
        const review = reviews.find(r => r.slug === slug && !r.draft);
        if (!review) {
          document.getElementById('review-header').innerHTML = '<h1>No encontramos esta review</h1>';
          document.getElementById('review-body').innerHTML = '';
          return;
        }
        document.title = review.title + ' — Escabiando Pociones';

        const pct = Math.max(0, Math.min(100, (Number(review.score) || 0) * 10));
        const cover = review.cover ? `<img src="${escapeHtml(fixAssetPath(review.cover))}" alt="" style="width:100%; border-radius:6px; margin-bottom:20px;">` : '';
        document.getElementById('review-header').innerHTML = `
          ${cover}
          <span class="eyebrow">${escapeHtml(review.game || '')}</span>
          <h1>${escapeHtml(review.title || '')}</h1>
          <div class="vial-score" style="margin-bottom:8px;">
            <div class="vial"><div class="vial-fill" style="height:${pct}%;"></div></div>
            ${review.score != null ? review.score + ' / 10' : ''}
          </div>
          <p style="font-family: var(--f-mono); font-size:0.85rem; color: var(--ink-dim);">
            ${review.author ? escapeHtml(review.author) + ' · ' : ''}${review.date ? formatDate(review.date) : ''}
          </p>
        `;

        let bodyHtml = (typeof marked !== 'undefined' && review.body)
          ? marked.parse(fixAssetPathsInMarkdown(review.body))
          : `<p>${escapeHtml(review.body || '')}</p>`;
        bodyHtml = embedYouTube(bodyHtml);
        document.getElementById('review-body').innerHTML = bodyHtml;
      })
      .catch(() => {
        document.getElementById('review-header').innerHTML = '<h1>No pudimos cargar esta review</h1>';
      });
  }

  window.addEventListener('pageshow', loadReview);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function fixAssetPath(p) {
    return p ? p.replace(/^\/(assets\/)/, '$1') : p;
  }
  function fixAssetPathsInMarkdown(md) {
    return (md || '').replace(/\]\(\/assets\//g, '](assets/');
  }
  function embedYouTube(html) {
    return html.replace(
      /<p>\s*<a[^>]*href="https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})[^"]*"[^>]*>[^<]*<\/a>\s*<\/p>/g,
      (m, id) => `<div class="embed-wrap" style="margin:20px 0;"><iframe width="100%" height="400" src="https://www.youtube.com/embed/${id}" title="Video de YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`
    );
  }
  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('es-419', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return iso; }
  }
</script>
</body>
</html>
