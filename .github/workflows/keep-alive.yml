name: Mantener despierto Supabase

on:
  schedule:
    # Todos los días a las 09:17 UTC (6:17 hora Argentina). Nunca en minuto 0:
    # GitHub avisa que a la hora en punto puede demorar o saltearse la corrida.
    - cron: "17 9 * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions, para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta real a la base de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL%/}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/comments?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase no respondió bien (HTTP $code). Revisar si el proyecto está pausado o si los secretos SUPABASE_URL / SUPABASE_ANON_KEY están bien."
            exit 1
          fi
