name: Actualizar índice de contenido

on:
  push:
    branches: [main]
    paths:
      - "content/reviews/**"
      - "content/noticias/**"
  workflow_dispatch: {} # para poder dispararlo a mano una vez y "rellenar" todo lo ya publicado

# Necesario para que el Action pueda commitear el resultado de vuelta al repo.
permissions:
  contents: write

# Si dos guardados disparan el Action casi al mismo tiempo (por ejemplo,
# al reemplazar una noticia destacada, que guarda dos veces seguidas),
# esto evita que las dos corridas se pisen: la segunda espera a que
# termine la primera en vez de correr en paralelo y perder su commit.
concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      # Usamos un token de acceso personal (PAGES_DEPLOY_TOKEN, guardado
      # como secreto del repo) en vez del token automático de GitHub. Es
      # necesario porque, por seguridad, GitHub NUNCA deja que un commit
      # hecho con su token automático dispare otros workflows (así evita
      # bucles infinitos) — y eso incluye el despliegue de GitHub Pages.
      # Con este token "de persona", el commit que arma este Action sí
      # puede disparar el despliegue de Jekyll, como corresponde.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}

      - name: Instalar dependencias de Python
        run: pip install markdown --break-system-packages --quiet

      - name: Armar content/reviews.json y content/noticias.json
        run: python3 scripts/build_content_index.py

      - name: Generar páginas de reviews/noticias, RSS y sitemap
        run: python3 scripts/render_articles.py

      # Indexa el sitio YA generado (tiene que ir después de armar las
      # páginas de arriba, para que el buscador encuentre el contenido
      # de la última corrida y no uno viejo). Sólo indexa lo que esté
      # marcado con data-pagefind-body en el HTML (las notas
      # individuales de reviews/noticias); el resto del sitio (admin,
      # listados, tags) queda afuera del buscador a propósito.
      - name: Indexar el sitio con Pagefind (buscador)
        run: npx -y pagefind --site .

      - name: Commitear todo lo generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/reviews.json content/noticias.json sitemap.xml rss.xml \
                  reviews/ noticias/ tags/ tags.html index.html reviews.html noticias.html
          git add -A -- pagefind/
          git diff --staged --quiet || git commit -m "Actualizar contenido, páginas, RSS, sitemap e índice de búsqueda"
          git push
