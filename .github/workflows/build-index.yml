name: Actualizar índice de contenido

on:
  push:
    branches: [main]
    paths:
      - "content/reviews/**"
      - "content/noticias/**"
  workflow_dispatch: {} # para poder dispararlo a mano una vez y "rellenar" todo lo ya publicado

# Necesario para que el Action pueda commitear el resultado de vuelta al repo.
permissions:
  contents: write

# Si dos guardados disparan el Action casi al mismo tiempo (por ejemplo,
# al reemplazar una noticia destacada, que guarda dos veces seguidas),
# esto evita que las dos corridas se pisen: la segunda espera a que
# termine la primera en vez de correr en paralelo y perder su commit.
concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de Python
        run: pip install markdown --break-system-packages --quiet

      - name: Armar content/reviews.json y content/noticias.json
        run: python3 scripts/build_content_index.py

      - name: Generar páginas de reviews/noticias, RSS y sitemap
        run: python3 scripts/render_articles.py

      - name: Commitear todo lo generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/reviews.json content/noticias.json sitemap.xml rss.xml \
                  reviews/ noticias/ index.html reviews.html noticias.html
          git diff --staged --quiet || git commit -m "Actualizar contenido, páginas, RSS y sitemap"
          git push
