# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: fgzan/escabiando-pociones
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "reviews"
    label: "Reviews"
    folder: "content/reviews"
    create: true
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}} — {{game}}"
    fields:
      - { label: "Título de la review", name: "title", widget: "string" }
      - { label: "Juego", name: "game", widget: "string" }
      - { label: "Puntaje (0 a 10)", name: "score", widget: "number", value_type: "float", min: 0, max: 10, required: false }
      - { label: "Imagen de portada", name: "cover", widget: "image", required: false }
      - { label: "Resumen corto (aparece en la tarjeta)", name: "excerpt", widget: "text" }
      - { label: "Texto completo", name: "body", widget: "markdown" }
      - { label: "Autor/a", name: "author", widget: "string", required: false }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Borrador (no se muestra en la web hasta destildar esto)", name: "draft", widget: "boolean", default: false }

  - name: "noticias"
    label: "Noticias"
    folder: "content/noticias"
    create: true
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Imagen de portada", name: "cover", widget: "image", required: false }
      - { label: "Resumen corto (aparece en la tarjeta)", name: "excerpt", widget: "text" }
      - { label: "Texto completo", name: "body", widget: "markdown" }
      - { label: "Autor/a", name: "author", widget: "string", required: false }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Borrador (no se muestra en la web hasta destildar esto)", name: "draft", widget: "boolean", default: false }
