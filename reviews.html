<link rel="stylesheet" href="style.css">
<script data-goatcounter="https://TU-CODIGO-DE-SITIO.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <img src="assets/logo-full.png" alt="Escabiando Pociones">
      ESCABIANDO POCIONES

    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>

      <li><a href="sobre.html">Sobre nosotros</a></li>
      <li><a href="prensa.html">Prensa</a></li>
    </ul>
  </div>
</nav>

<header class="page-header">
  <div class="container">
    <span class="eyebrow-lg">Reviews</span>
  </div>
</header>

<section class="section">
  <div class="container">
    <div id="reviews-list">
      <div class="empty-vial">
        <p class="mt-0">Todavía no hay reviews publicadas.</p>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <small>© 2026 Escabiando Pociones</small>
    <div class="social-links">
      <a href="https://open.spotify.com/show/587CqZd5K8oaRWqiVCQWSP" target="_blank" rel="noopener">Spotify</a>
      <a href="https://www.youtube.com/@EscabiandoPociones/videos" target="_blank" rel="noopener">YouTube</a>
      <a href="prensa.html">Prensa</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  fetch('content/reviews.json')
    .then(r => r.json())
    .then(data => {
      let reviews = Array.isArray(data) ? data : (data.reviews || []);
      reviews = reviews.filter(r => !r.draft);
      if (reviews.length === 0) return;
      reviews.sort((a, b) => new Date(b.date) - new Date(a.date));

      const html = reviews.map(r => {
        const pct = Math.max(0, Math.min(100, (Number(r.score) || 0) * 10));
        const cover = r.cover ? `<img src="${escapeHtml(fixAssetPath(r.cover))}" alt="" style="width:100%; border-radius:4px; margin-bottom:14px;">` : '';
        return `
          <a class="card" href="review.html?slug=${encodeURIComponent(r.slug)}" style="display:block; margin-bottom:20px;">
            ${cover}
            <span class="eyebrow">${escapeHtml(r.game || '')}</span>
            <h3>${escapeHtml(r.title || '')}</h3>
            <p>${escapeHtml(r.excerpt || '')}</p>
            <div class="vial-score">
              <div class="vial"><div class="vial-fill" style="height:${pct}%;"></div></div>
              ${r.score != null ? r.score + ' / 10' : ''}
            </div>
          </a>`;
      }).join('');

      document.getElementById('reviews-list').innerHTML =
        `<div class="grid grid-3">${html}</div>`;
    })
    .catch(() => {});

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function fixAssetPath(p) {
    return p ? p.replace(/^\/(assets\/)/, '$1') : p;
  }
</script>
</body>
</html>
